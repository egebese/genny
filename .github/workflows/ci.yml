name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Enough to satisfy packages/env in unit and integration runs. None of it is
  # real, and none of it reaches a real service.
  GENNY_MODE: byok
  APP_URL: http://localhost:3000
  AUTH_SECRET: Y2ktc2VjcmV0LWZvci10ZXN0aW5nLW9ubHktMzJieXRlcw==
  GENNY_ENCRYPTION_KEY: Y2ktZW5jcnlwdGlvbi1rZXktdGVzdGluZy1vbmx5LTMyYg==
  DATABASE_URL: postgresql://genny_app:genny@localhost:55432/genny
  S3_ENDPOINT: http://localhost:9100
  S3_REGION: us-east-1
  S3_BUCKET: genny
  S3_ACCESS_KEY_ID: genny
  S3_SECRET_ACCESS_KEY: gennygenny
  S3_PUBLIC_URL: http://localhost:9100/genny

jobs:
  static:
    name: lint, types, architecture
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec biome ci .
      - run: pnpm typecheck
      # The architecture rules are a gate, not advice.
      - run: pnpm deps:check

  unit:
    name: unit tests
    runs-on: ubuntu-latest
    needs: static
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test

  integration:
    name: integration tests (real postgres)
    runs-on: ubuntu-latest
    needs: static
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # testcontainers starts its own Postgres, so there is no service block
      # here: the tests own the container and mount the same role bootstrap the
      # dev stack uses.
      - run: pnpm test:integration

  build:
    name: production build (known broken upstream, see ADR 0009)
    runs-on: ubuntu-latest
    needs: static
    # Not a gate: `next build` fails inside Next's own error-page prerender on
    # every 16.3.x and 16.4 canary. Kept visible so it turns green on its own the
    # day upstream fixes it, without blocking contributors meanwhile.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
