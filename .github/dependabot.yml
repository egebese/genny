version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule: { interval: weekly, day: monday }
    open-pull-requests-limit: 5
    groups:
      # One PR for the framework, one for tooling. Fifteen separate PRs a week is
      # how dependency updates get ignored entirely.
      next:
        patterns: ['next', 'react', 'react-dom', '@types/react*']
      tooling:
        patterns: ['@biomejs/*', 'turbo', 'typescript', 'vitest', '@playwright/*']
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: monthly }
