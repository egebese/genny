# Local development stack. Nothing here is required in production: Postgres can
# be Supabase or any managed instance, and MinIO can be S3, R2 or Supabase
# Storage, because both are reached through standard protocols.
name: genny

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: genny
    ports:
      # High ports on purpose: 5432 and 9000 are routinely taken on a developer
      # machine (a host Postgres, another project's Supabase, MinIO). Colliding
      # there fails in the worst way, by silently connecting to the wrong server.
      - '55432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
      # Creates genny_app and genny_migrator on first boot. Testcontainers
      # mounts the same file so tests and dev share privilege shapes.
      - ./init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d genny']
      interval: 5s
      timeout: 3s
      retries: 20

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: genny
      MINIO_ROOT_PASSWORD: gennygenny
    ports:
      - '9100:9000'
      - '9101:9001'
    volumes:
      - minio-data:/data
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 5s
      timeout: 3s
      retries: 20

  # Creates the bucket once, then exits. Keeps first-run setup out of the README.
  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 genny gennygenny &&
      mc mb --ignore-existing local/genny &&
      mc anonymous set download local/genny &&
      echo 'bucket ready'
      "

volumes:
  postgres-data:
  minio-data:
